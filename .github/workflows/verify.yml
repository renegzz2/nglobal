name: Verify nGlobal

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: test -s dist/sw.js && test -s dist/manifest.json

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - run: deno check --no-config supabase/functions/gemini-chat/index.ts supabase/functions/send-push/index.ts supabase/functions/tive-webhook/index.ts

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: local-ci-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Check migrations and access rules
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/security.sql

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the current source tree and redact findings
        run: |
          git ls-files -z | tar --null -T - -cf /tmp/nglobal-source.tar
          mkdir /tmp/nglobal-source
          tar -xf /tmp/nglobal-source.tar -C /tmp/nglobal-source
          docker run --rm -v /tmp/nglobal-source:/source:ro ghcr.io/gitleaks/gitleaks:v8.24.3 dir --redact /source
